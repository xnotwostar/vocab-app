<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lexicon — Library</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .page { padding: 52px 56px 80px; max-width: 1360px; width: 100%; margin: 0 auto; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 36px; }
  .page-title { font-family: var(--serif); font-weight: 700; font-size: 52px; line-height: 1; letter-spacing: -0.02em; margin: 0 0 14px; }
  .page-sub {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--ink-dim); display: flex; gap: 18px;
  }
  .page-sub .sep { color: var(--ink-ghost); }
  .page-sub .n { color: var(--ink); }

  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
  .search { flex: 1; position: relative; max-width: 460px; }
  .search input {
    width: 100%; background: transparent; border: none;
    border-bottom: 1px solid var(--hairline-strong);
    color: var(--ink); font-family: var(--serif); font-weight: 600;
    font-size: 17px; padding: 10px 0 10px 26px; outline: none;
    transition: border-color 160ms;
  }
  .search input::placeholder { color: var(--ink-faint); }
  .search input:focus { border-bottom-color: var(--amber); }
  .search .icon { position: absolute; left: 0; top: 50%; transform: translateY(-50%); color: var(--ink-faint); }
  .search .icon svg { width: 14px; height: 14px; }

  .filters { display: flex; gap: 2px; border: 1px solid var(--hairline); border-radius: 2px; padding: 2px; }
  .filter {
    all: unset; cursor: pointer; padding: 7px 12px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--ink-dim); border-radius: 1px;
    transition: background 160ms, color 160ms;
  }
  .filter:hover { color: var(--ink); }
  .filter.active { background: rgba(237, 227, 209, 0.05); color: var(--ink); }
  .filter .count { margin-left: 8px; color: var(--ink-ghost); font-size: 9px; }
  .filter.active .count { color: var(--amber); }

  .tbl { width: 100%; border-top: 1px solid var(--hairline); }
  .tbl-head, .tbl-row {
    display: grid;
    grid-template-columns: 2fr 3fr 100px 110px 60px;
    align-items: center; column-gap: 24px;
  }
  .tbl-head {
    padding: 14px 12px; border-bottom: 1px solid var(--hairline);
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.28em;
    text-transform: uppercase; color: var(--ink-faint);
  }
  .tbl-row { padding: 16px 12px; border-bottom: 1px solid var(--hairline); cursor: pointer; transition: background 140ms; }
  .tbl-row:hover { background: rgba(237, 227, 209, 0.022); }

  .word-cell { font-family: var(--serif); font-weight: 700; font-size: 20px; letter-spacing: -0.01em; color: var(--ink); line-height: 1.1; }
  .word-cell .phonetic { font-family: var(--mono); font-weight: 400; font-size: 11px; letter-spacing: 0.06em; color: var(--ink-faint); margin-left: 8px; }
  .meaning-cell { font-family: var(--serif); font-size: 15px; color: var(--ink-dim); line-height: 1.45; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .diff-cell { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; color: var(--amber); text-align: right; }
  .due-cell { font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; color: var(--ink-dim); text-align: right; }
  .due-cell.due-now, .due-cell.overdue { color: var(--amber); }
  .play-cell { text-align: right; }
  .play-cell button {
    all: unset; cursor: pointer;
    width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid var(--hairline-strong);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--ink-faint);
  }
  .play-cell button:hover { color: var(--amber); border-color: var(--amber); }
  .play-cell svg { width: 12px; height: 12px; }

  .tbl-foot { padding: 24px 12px 0; font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; color: var(--ink-faint); }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><a href="index.html"><span>Lexicon</span><span class="dot">.</span></a></div>
    <nav class="nav">
      <a href="index.html">Review</a>
      <a href="library.html" class="active">Library</a>
      <a href="stats.html">Stats</a>
      <a href="typing.html">Typing</a>
    </nav>
    <div class="session-meta">
      <span>Due today <span class="num" id="due-count">—</span></span>
      <span>Total <span class="num" id="total-count">—</span></span>
    </div>
  </header>

  <main class="page">
    <div class="page-head">
      <div>
        <h1 class="page-title">Library</h1>
        <div class="page-sub">
          <span><span class="n" id="stat-total">—</span> Words</span>
          <span class="sep">·</span>
          <span><span class="n" id="stat-last">—</span> Last updated</span>
        </div>
      </div>
    </div>

    <div class="toolbar">
      <div class="search">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
            <circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/>
          </svg>
        </span>
        <input type="text" id="search-input" placeholder="Search by word, meaning, or example…" />
      </div>
      <div class="filters" id="filters">
        <button class="filter active" data-filter="all">All <span class="count" id="count-all">—</span></button>
        <button class="filter" data-filter="due">Due <span class="count" id="count-due">—</span></button>
        <button class="filter" data-filter="learning">Learning <span class="count" id="count-learning">—</span></button>
        <button class="filter" data-filter="mature">Mature <span class="count" id="count-mature">—</span></button>
      </div>
    </div>

    <div class="tbl">
      <div class="tbl-head">
        <div>Word</div>
        <div>Meaning</div>
        <div style="text-align:right">Diff</div>
        <div style="text-align:right">Due</div>
        <div></div>
      </div>
      <div id="tbl-body"></div>
      <div class="tbl-foot" id="tbl-foot">Loading…</div>
    </div>
  </main>
</div>

<script type="module" src="app.js"></script>
<script type="module" src="library.js"></script>
</body>
</html>
