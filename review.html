<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lexicon — Review</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* Page-specific */
  .etymology {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em;
    color: var(--ink-faint); margin-top: 14px;
  }
  .etymology .arrow { color: var(--ink-ghost); margin: 0 10px; }

  .synonyms {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
    margin-top: 20px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
  }
  .synonyms .chip {
    padding: 4px 10px; border: 1px solid var(--hairline-strong); border-radius: 2px;
    color: var(--ink-dim);
  }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand"><a href="index.html"><span>Lexicon</span><span class="dot">.</span></a></div>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="review.html" class="active">Review</a>
      <a href="library.html">Library</a>
      <a href="stats.html">Stats</a>
    </nav>
    <div class="session-meta">
      <span>Session <span class="num" id="session-progress">0 / 0</span></span>
      <span>Due today <span class="num" id="due-count">0</span></span>
    </div>
  </header>

  <main class="stage" id="stage">
    <!-- Populated by app.js -->
  </main>

  <footer class="shortcuts">
    <div class="group">
      <span><span class="kbd">Space</span>Reveal</span>
      <span><span class="kbd">1</span>不记得 <span class="kbd">2</span>记得</span>
      <span><span class="kbd">S</span>Speak</span>
    </div>
    <div class="group">
      <span id="fsrs-meta">FSRS · ready</span>
    </div>
  </footer>

</div>

<script type="module" src="app.js"></script>
<script type="module" src="review.js"></script>
</body>
</html>
