<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lexicon — Typing</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .prompt {
    font-family: var(--serif); font-weight: 600;
    font-size: clamp(28px, 3.5vw, 42px);
    line-height: 1.3; letter-spacing: -0.012em;
    color: var(--ink); text-align: center;
    max-width: 780px; margin: 0 auto 10px;
    text-wrap: pretty;
  }
  .prompt .em { color: var(--ink-dim); }
  .prompt-sub {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.28em;
    text-transform: uppercase; color: var(--ink-faint);
    display: inline-flex; align-items: center; gap: 14px; margin-top: 12px;
  }
  .prompt-sub .tick { width: 18px; height: 1px; background: var(--hairline-strong); display: inline-block; }
  .answer-wrap { width: 100%; max-width: 620px; margin: 72px auto 0; position: relative; }
  .answer-label {
    position: absolute; top: -22px; left: 0;
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.28em;
    text-transform: uppercase; color: var(--ink-faint);
  }
  .answer-hint {
    position: absolute; top: -22px; right: 0;
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.24em;
    color: var(--ink-ghost);
  }
  .answer {
    width: 100%; background: transparent; border: none; outline: none;
    border-bottom: 1px solid var(--hairline-strong);
    color: var(--ink);
    font-family: var(--serif); font-weight: 700;
    font-size: 42px; line-height: 1.2;
    padding: 10px 0 14px; text-align: center;
    letter-spacing: -0.01em;
    transition: border-color 200ms ease;
  }
  .answer::placeholder { color: var(--ink-ghost); }
  .result { width: 100%; max-width: 620px; margin: 18px auto 0; min-height: 64px; text-align: center; }
  .result .status {
    display: inline-flex; align-items: center; gap: 12px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.28em;
    text-transform: uppercase; padding: 6px 0;
  }
  .result .reveal { display: block; font-family: var(--serif); font-weight: 700; font-size: 22px; color: var(--ink); margin-top: 8px; }
  .result .diff { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--ink-dim); margin-top: 6px; display: block; }
  .state-ok .answer  { border-bottom-color: var(--ok); color: var(--ok); }
  .state-bad .answer { border-bottom-color: var(--bad); color: var(--bad); }
  .state-ok .result .status  { color: var(--ok); }
  .state-bad .result .status { color: var(--bad); }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand"><a href="index.html"><span>Lexicon</span><span class="dot">.</span></a></div>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="review.html">Review</a>
      <a href="library.html">Library</a>
      <a href="stats.html">Stats</a>
      <a href="typing.html" class="active">Typing</a>
    </nav>
    <div class="session-meta">
      <span>Session <span class="num" id="session-progress">0 / 0</span></span>
    </div>
  </header>

  <main class="stage">
    <div class="card-frame" id="card-frame">
      <!-- Populated by typing.js -->
    </div>
  </main>

  <footer class="shortcuts">
    <div class="group">
      <span><span class="kbd">↵</span>Submit</span>
      <span><span class="kbd">1</span><span class="kbd">2</span><span class="kbd">3</span><span class="kbd">4</span>Grade</span>
      <span><span class="kbd">S</span>Speak</span>
      <span><span class="kbd">⇥</span>Skip</span>
    </div>
    <div class="group">
      <span id="target-meta">Target · —</span>
    </div>
  </footer>
</div>

<script type="module" src="app.js"></script>
<script type="module" src="typing.js"></script>
</body>
</html>
