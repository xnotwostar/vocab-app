<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Lexicon — Review</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* ---------- Plan header (above card) ---------- */
  .plan-header {
    padding: 24px 40px 20px;
    border-bottom: 1px solid var(--hairline);
  }
  .plan-header-inner {
    max-width: 880px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .plan-head-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 20px;
  }
  .plan-date {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin: 0;
  }
  .plan-date .weekday {
    color: var(--ink-dim);
    font-weight: 500;
    margin-right: 12px;
  }
  .plan-count {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.24em;
    color: var(--ink-dim);
    text-transform: uppercase;
  }
  .plan-count .num { color: var(--amber); font-weight: 700; }

  .plan-progress {
    height: 4px;
    background: var(--hairline);
    overflow: hidden;
    position: relative;
  }
  .plan-progress-fill {
    height: 100%;
    background: var(--amber);
    transition: width 400ms ease;
  }

  .plan-metrics {
    display: flex;
    gap: 30px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--ink-dim);
    text-transform: uppercase;
  }
  .plan-metric .num { color: var(--ink); font-weight: 700; }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand"><a href="index.html"><span>Lexicon</span><span class="dot">.</span></a></div>
    <nav class="nav">
      <a href="index.html" class="active">Review</a>
      <a href="library.html">Library</a>
      <a href="stats.html">Stats</a>
    </nav>
    <div class="session-meta">
      <span>Streak <span class="num" id="stat-streak">—</span></span>
    </div>
  </header>

  <!-- Plan header: date + progress + week stats -->
  <div class="plan-header" id="plan-header">
    <div class="plan-header-inner">
      <div class="plan-head-row">
        <h2 class="plan-date">
          <span class="weekday" id="plan-weekday">—</span>
          <span id="plan-date">—</span>
        </h2>
        <div class="plan-count">
          <span class="num" id="plan-done">0</span> / <span id="plan-total">—</span>
          &nbsp;·&nbsp; <span id="plan-remaining">—</span>
        </div>
      </div>
      <div class="plan-progress">
        <div class="plan-progress-fill" id="plan-progress-fill" style="width:0%"></div>
      </div>
      <div class="plan-metrics">
        <div class="plan-metric">
          Reviews <span class="num" id="stat-reviews">—</span>
        </div>
        <div class="plan-metric">
          Retention <span class="num" id="stat-retention">—</span><span style="opacity:0.5">%</span>
        </div>
        <div class="plan-metric">
          Mastered <span class="num" id="stat-mastered">—</span><span style="opacity:0.5">/<span id="stat-total">—</span></span>
        </div>
      </div>
    </div>
  </div>

  <main class="stage" id="stage">
    <!-- Populated by review.js -->
  </main>

  <footer class="shortcuts">
    <div class="group">
      <span><span class="kbd">Space</span>Reveal</span>
      <span><span class="kbd">1</span>不记得 <span class="kbd">2</span>记得</span>
      <span><span class="kbd">S</span>Speak</span>
    </div>
    <div class="group">
      <span id="fsrs-meta">—</span>
    </div>
  </footer>

</div>

<script type="module" src="app.js"></script>
<script type="module" src="review.js"></script>
</body>
</html>
